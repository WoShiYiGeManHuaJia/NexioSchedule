name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for v in 37 36 35; do
            sdkmanager --install "platforms;android-$v" > /dev/null 2>&1 && { echo "platform android-$v"; break; }
          done
          sdkmanager --install "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Align compileSdk
        run: |
          AVAIL=$(ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -o 'android-[0-9]*' | grep -o '[0-9]*' | sort -n | tail -1)
          echo "platform=$AVAIL"
          if [ -n "$AVAIL" ]; then
            sed -i "s/compileSdk = [0-9]\+/compileSdk = $AVAIL/" app/build.gradle.kts
            sed -i "s/targetSdk = [0-9]\+/targetSdk = $AVAIL/" app/build.gradle.kts
          fi
          chmod +x ./gradlew

      - name: Ensure debug keystore exists
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          ls -l "$HOME/.config/.android/debug.keystore"

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set +e
          export GH_TOKEN="${{ secrets.KEBIAO_GH_TOKEN }}"
          ./gradlew assembleRelease --no-daemon > /tmp/build.log 2>&1
          echo "GRADLE_EXIT=$?" >> $GITHUB_OUTPUT
          echo "gradle_exit=$?" > /tmp/exit.txt
          cat /tmp/exit.txt
          set -e
          echo "done"

      - name: Fallback to debug if release failed
        if: always()
        continue-on-error: true
        run: |
          set +e
          if ! ls app/build/outputs/apk/release/*.apk > /dev/null 2>&1; then
            echo "release 无产物，回退 debug"
            ./gradlew assembleDebug --no-daemon > /tmp/build2.log 2>&1
            echo "debug_exit=$?"
          else
            echo "release 已有产物"
          fi
          set -e

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name "*.apk" -type f -print 2>/dev/null | while read f; do cp "$f" "out/$(basename "$f")"; done
          ls -lh out/ || echo "无 APK"

      - name: Upload build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p buildlog
          {
            echo "commit: $(git rev-parse --short HEAD)"
            echo "gradle_exit: $(cat /tmp/exit.txt 2>/dev/null)"
            echo "--- apk 输出目录 ---"
            ls -lh app/build/outputs/apk/*/ 2>/dev/null || echo "(无)"
            echo "--- 编译错误 ---"
            grep -E '^e: |^w: .*error|FAILURE:|BUILD FAILED|BUILD SUCCESSFUL' /tmp/build.log 2>/dev/null | head -40
            echo "--- build.log 尾部 ---"
            tail -30 /tmp/build.log 2>/dev/null
            echo "--- debug 回退日志尾部 ---"
            tail -20 /tmp/build2.log 2>/dev/null
          } > buildlog/out.txt 2>&1
          cat buildlog/out.txt
          B64=$(base64 -w 0 buildlog/out.txt)
          SHA=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/buildlog/out.txt" | jq -r '.sha // empty')
          if [ -n "$SHA" ]; then
            JSON=$(jq -n --arg c "$B64" --arg s "$SHA" '{message:"build diagnostics",content:$c,sha:$s}')
          else
            JSON=$(jq -n --arg c "$B64" '{message:"build diagnostics",content:$c}')
          fi
          curl -sS -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/buildlog/out.txt" \
            -d "$JSON" | head -c 300
          echo ""

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: warn

      - name: Publish APK to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ls -lh out/
          # 固定名 app-release.apk = 用户下载用的稳定入口，必须每次都是最新。
          # 带时间戳的只作存档。
          TAG="builtin-latest"
          NAME="NexioSchedule-$(date -u +%Y%m%d-%H%M).apk"
          gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create "$TAG" --repo ${{ github.repository }} --title "课表 APK" --notes "auto build"
          # 固定名 app-release.apk 必须始终存在且始终是最新的：
          # 用户拿的是固定下载链接，文件名一变链接就 404，
          # 表现就是"我明明改了，他下的还是旧的/下不到"。
          for f in out/app-release.apk out/app-debug.apk; do
            [ -e "$f" ] || continue
            echo "发布为 app-release.apk 大小 $(stat -c%s "$f") md5 $(md5sum "$f" | cut -d' ' -f1)"
            cp "$f" out/app-release.apk
            gh release upload "$TAG" out/app-release.apk --repo ${{ github.repository }} --clobber
            break
          done
          # 同时留一份带时间戳的存档，方便回溯；只保留最近 3 份，避免越堆越多
          for f in out/app-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/$NAME"
            gh release upload "$TAG" "out/$NAME" --repo ${{ github.repository }} --clobber
          done
          gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets[].name' \
            | grep -E '^NexioSchedule-[0-9]{8}-[0-9]{4}\.apk$' | sort -r | tail -n +4 \
            | while read -r oldname; do
                echo "清理旧存档 $oldname"
                gh release delete-asset "$TAG" "$oldname" --repo ${{ github.repository }} --yes 2>/dev/null || true
              done
          echo "--- release 现有文件 ---"
          gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets[].name' || true
