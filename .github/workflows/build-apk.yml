name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for v in 37 36 35; do
            sdkmanager --install "platforms;android-$v" > /dev/null 2>&1 && { echo "platform android-$v"; break; }
          done
          sdkmanager --install "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Align compileSdk
        run: |
          AVAIL=$(ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -o 'android-[0-9]*' | grep -o '[0-9]*' | sort -n | tail -1)
          echo "platform=$AVAIL"
          if [ -n "$AVAIL" ]; then
            sed -i "s/compileSdk = [0-9]\+/compileSdk = $AVAIL/" app/build.gradle.kts
            sed -i "s/targetSdk = [0-9]\+/targetSdk = $AVAIL/" app/build.gradle.kts
          fi
          chmod +x ./gradlew

      - name: Build release APK
        id: build
        run: |
          ./gradlew assembleRelease --no-daemon > /tmp/build.log 2>&1
          echo "exit=$?"
          echo "=== 错误汇总 ==="
          grep -E '^e: |error:|FAILED|What went wrong|^> ' /tmp/build.log | head -60 > /tmp/errs.txt || true
          cat /tmp/errs.txt
          echo "=== 末尾 40 行 ==="
          tail -40 /tmp/build.log
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p out
          find . -name "*.apk" -type f 2>/dev/null | while read f; do cp "$f" "out/$(basename "$f")"; done
          ls -lh out/ || echo "无 APK"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: warn

      - name: Save build errors to repo
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "commit: $(git rev-parse --short HEAD)"; echo; cat /tmp/errs.txt 2>/dev/null; echo; echo "--- tail ---"; tail -60 /tmp/build.log 2>/dev/null; } > /tmp/errors.txt
          B64=$(base64 -w 0 /tmp/errors.txt)
          curl -sS -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/buildlog/errors.txt" \
            -d "{\"message\":\"build errors\",\"content\":\"$B64\"}" > /dev/null
          echo "saved"
