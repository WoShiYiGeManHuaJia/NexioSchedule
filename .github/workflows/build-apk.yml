name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          echo "--- 已安装 platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(空)"
          echo "--- 已安装 build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(空)"
          echo "--- cmdline-tools ---"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "(空)"

      - name: Install SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for v in 37 36 35; do
            echo "尝试安装 platform android-$v ..."
            if sdkmanager --install "platforms;android-$v" > /dev/null 2>&1; then
              echo "✅ 装到 android-$v"; break
            fi
          done
          sdkmanager --install "build-tools;35.0.0" > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" > /dev/null 2>&1 || true
          echo "--- 最终 platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null

      - name: Align compileSdk to installed platform
        run: |
          AVAIL=$(ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -o 'android-[0-9]*' | grep -o '[0-9]*' | sort -n | tail -1)
          echo "可用最高 platform: ${AVAIL:-none}"
          if [ -z "$AVAIL" ]; then echo "无可用 platform，退出"; exit 1; fi
          CUR=$(grep -m1 'compileSdk' app/build.gradle.kts | grep -o '[0-9]\+')
          echo "项目 compileSdk: $CUR"
          if [ "$AVAIL" != "$CUR" ]; then
            echo "调整 compileSdk/targetSdk: $CUR -> $AVAIL"
            sed -i "s/compileSdk = [0-9]\+/compileSdk = $AVAIL/" app/build.gradle.kts
            sed -i "s/targetSdk = [0-9]\+/targetSdk = $AVAIL/" app/build.gradle.kts
            grep -n 'compileSdk\|targetSdk' app/build.gradle.kts
          else
            echo "无需调整"
          fi

      - name: Grant gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -x lint
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p out
          find . -name "*.apk" -type f 2>/dev/null | while read f; do cp "$f" "out/$(basename "$f")"; done
          ls -lh out/ 2>/dev/null || echo "无 APK 产出"

      - name: Upload build log on failure
        if: failure()
        run: |
          echo "=== gradle 末尾输出 ===" || true
          true

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: warn
