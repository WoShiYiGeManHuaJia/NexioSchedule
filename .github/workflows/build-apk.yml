name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'app-release.apk'
      - 'buildlog/**'

permissions:
  contents: write

# 之前多个构建并发跑，先跑完的旧代码包会盖掉后跑完的新包。
# 现在同一时间只允许一个构建，后来的排队等待，不取消（取消会丢产物）。
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing keystore from Actions secret
        env:
          NEXIO_KEYSTORE_B64: ${{ secrets.NEXIO_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$NEXIO_KEYSTORE_B64" | base64 -d > keystore/softbig.jks
          chmod 600 keystore/softbig.jks

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for v in 37 36 35; do
            sdkmanager --install "platforms;android-$v" > /dev/null 2>&1 && { echo "platform android-$v"; break; }
          done
          sdkmanager --install "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Align compileSdk
        run: |
          AVAIL=$(ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -o 'android-[0-9]*' | grep -o '[0-9]*' | sort -n | tail -1)
          echo "platform=$AVAIL"
          if [ -n "$AVAIL" ]; then
            sed -i "s/compileSdk = [0-9]\+/compileSdk = $AVAIL/" app/build.gradle.kts
            sed -i "s/targetSdk = [0-9]\+/targetSdk = $AVAIL/" app/build.gradle.kts
          fi
          chmod +x ./gradlew

      - name: Ensure debug keystore exists
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          ls -l "$HOME/.config/.android/debug.keystore"

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set +e
          # 强制全量重编：之前怀疑复用了旧产物，导致新包与仓库里的旧包字节完全一致
          rm -rf app/build app/build/outputs
          ./gradlew assembleRelease --no-daemon > /tmp/build.log 2>&1
          echo "GRADLE_EXIT=$?" >> $GITHUB_OUTPUT
          echo "gradle_exit=$?" > /tmp/exit.txt
          cat /tmp/exit.txt
          set -e
          echo "done"

      - name: Fallback to debug if release failed
        if: always()
        continue-on-error: true
        run: |
          set +e
          if ! ls app/build/outputs/apk/release/*.apk > /dev/null 2>&1; then
            echo "release 无产物，回退 debug"
            ./gradlew assembleDebug --no-daemon > /tmp/build2.log 2>&1
            echo "debug_exit=$?"
          else
            echo "release 已有产物"
          fi
          set -e

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          # 不能用 find 全局搜：仓库根目录也提交了一份 app-release.apk（供国内下载），
          # 它与构建产物同名，cp 到 out/ 时会互相覆盖，谁后写谁赢，
          # 结果每次发出去的一直是仓库里那份旧包（构建号永远停在 20261020-2）。
          # 现在只从构建产物目录取。
          for f in app/build/outputs/apk/release/app-release.apk \
                   app/build/outputs/apk/debug/app-debug.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/$(basename "$f")"
          done
          ls -lh out/ || echo "无 APK"
          # 自检：确认 out/ 里是本次新构建（含最新构建号），不是仓库里的旧包
          for f in out/*.apk; do
            [ -e "$f" ] || continue
            echo "$f md5: $(md5sum "$f" | cut -d' ' -f1)"
            echo -n "$f 内含构建号: "
            unzip -p "$f" classes.dex > /tmp/dex.bin 2>/dev/null || true
            strings /tmp/dex.bin 2>/dev/null | grep -oE "2026[0-9]{4}-[0-9]" | sort -u | tr '\n' ' '
            echo ""
          done

      - name: Upload build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p buildlog
          {
            echo "commit: $(git rev-parse --short HEAD)"
            echo "gradle_exit: $(cat /tmp/exit.txt 2>/dev/null)"
            echo "--- apk 输出目录 ---"
            ls -lh app/build/outputs/apk/*/ 2>/dev/null || echo "(无)"
            echo "--- 编译错误 ---"
            grep -E '^e: |^w: .*error|FAILURE:|BUILD FAILED|BUILD SUCCESSFUL' /tmp/build.log 2>/dev/null | head -40
            echo "--- build.log 尾部 ---"
            tail -30 /tmp/build.log 2>/dev/null
            echo "--- debug 回退日志尾部 ---"
            tail -20 /tmp/build2.log 2>/dev/null
          } > buildlog/out.txt 2>&1
          cat buildlog/out.txt
          B64=$(base64 -w 0 buildlog/out.txt)
          SHA=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/buildlog/out.txt" | jq -r '.sha // empty')
          if [ -n "$SHA" ]; then
            JSON=$(jq -n --arg c "$B64" --arg s "$SHA" '{message:"build diagnostics",content:$c,sha:$s}')
          else
            JSON=$(jq -n --arg c "$B64" '{message:"build diagnostics",content:$c}')
          fi
          curl -sS -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/buildlog/out.txt" \
            -d "$JSON" | head -c 300
          echo ""

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: warn

      - name: Publish APK to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ls -lh out/
          # 只保留一个固定文件名 app-release.apk。
          # 之前用时间戳命名（NexioSchedule-20261020-0143.apk）并删掉 app-release.apk，
          # 导致外部固定链接一直指向旧包，用户装完发现改动没生效。现在固定名字直接覆盖。
          TAG="builtin-latest"
          SRC=""
          for f in out/app-release.apk out/app-debug.apk; do
            [ -e "$f" ] || continue
            SRC="$f"; break
          done
          if [ -z "$SRC" ]; then echo "无 APK 可发布"; exit 0; fi
          gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create "$TAG" --repo ${{ github.repository }} --title "课表 APK" --notes "auto build"
          echo "源文件 $SRC 大小 $(stat -c%s "$SRC")"
          echo "md5    $(md5sum "$SRC" | cut -d' ' -f1)"
          echo "sha256 $(sha256sum "$SRC" | cut -d' ' -f1)"
          # 覆盖上传固定名
          gh release upload "$TAG" "$SRC#app-release.apk" --repo ${{ github.repository }} --clobber
          # 删掉历史遗留的时间戳命名，避免误下旧包
          gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets[].name' | \
            grep -E '^NexioSchedule-[0-9]{8}-[0-9]{4}\.apk$' | while read old; do
              echo "删除旧资产 $old"
              gh release delete-asset "$TAG" "$old" --repo ${{ github.repository }} --yes 2>/dev/null || true
            done
          echo "--- release 现有文件 ---"
          gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets[] | "name=\(.name\) size=\(.size\) updated=\(.updated_at\)"' || true

      - name: Commit APK to repo root
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          SRC=""
          for f in out/app-release.apk out/app-debug.apk; do
            [ -e "$f" ] || continue
            SRC="$f"; break
          done
          [ -n "$SRC" ] || { echo "无 APK"; exit 0; }
          HEAD_SHA=$(git rev-parse --short HEAD)
          APK_MD5=$(md5sum "$SRC" | cut -d' ' -f1)
          echo "构建指纹: 源码=$HEAD_SHA md5=$APK_MD5"
          {
            echo "source_commit=$HEAD_SHA"
            echo "apk_md5=$APK_MD5"
            echo "apk_sha256=$(sha256sum "$SRC" | cut -d' ' -f1)"
            echo "apk_size=$(stat -c%s "$SRC")"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/fp.txt
          cat /tmp/fp.txt
          mkdir -p buildlog && cp /tmp/fp.txt buildlog/fingerprint.txt
          # 用 git 命令行提交：contents API 对 >1MB 文件会静默失败（3.3MB 必失败），
          # 之前就是它导致仓库里的 app-release.apk 一直是旧包。
          # [skip ci] + workflow 的 paths-ignore 双保险，避免这次提交再触发构建。
          cp "$SRC" app-release.apk
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # 前面的诊断步骤会用 API 提交 buildlog，远程已有新 commit；
          # 原先直接 commit+push 会因非快进被拒，rebase 又因未暂存改动失败。
          # 这里直接从 origin/master 新建分支再提交，保证是快进。
          git fetch origin master >> /tmp/gitinfo.txt 2>&1
          git checkout -f -B apkdist origin/master >> /tmp/gitinfo.txt 2>&1
          cp "$SRC" app-release.apk
          cp /tmp/fp.txt buildlog/fingerprint.txt 2>/dev/null || true
          git add -f app-release.apk buildlog/fingerprint.txt >> /tmp/gitinfo.txt 2>&1
          git commit -m "apk: $HEAD_SHA [skip ci]" >> /tmp/gitinfo.txt 2>&1
          echo "commit_exit=$?" >> /tmp/gitinfo.txt
          git push origin apkdist:master >> /tmp/gitinfo.txt 2>&1
          echo "push_exit=$?" >> /tmp/gitinfo.txt
          git checkout -f master >> /tmp/gitinfo.txt 2>&1
          {
            echo "=== 仓库 APK md5 ==="
            git show origin/master:app-release.apk 2>/dev/null | md5sum | cut -d' ' -f1
            echo "=== 本次构建 md5 ==="
            md5sum "$SRC" | cut -d' ' -f1
            echo "=== gitinfo ==="
          } > /tmp/head.txt 2>&1
          cat /tmp/head.txt /tmp/gitinfo.txt > /tmp/gitall.txt
          echo "仓库内 md5: $(md5sum app-release.apk | cut -d' ' -f1)"
